<title>Story Builder Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: top bar, then one or two panes (staff console / client portal) side by side. Each pane = switcher, tabs, body. Dark-first with orange accent to match Agency OS. */
:root{
  --bg:#0d0e11; --surface:#15171c; --surface2:#1c1f26; --line:#2a2e37; --fg:#eceef3; --muted:#9aa1ae;
  --accent:#ff7a1a; --accent-ink:#1b0e03; --accent-soft:rgba(255,122,26,.14);
  --good:#3ccb94; --good-soft:rgba(60,203,148,.14); --warn:#f4b73e; --warn-soft:rgba(244,183,62,.15);
  --bad:#ff6363; --bad-soft:rgba(255,99,99,.15); --info:#6aa8ff; --info-soft:rgba(106,168,255,.15);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --display:'Space Grotesk','Inter',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#f0f1f4; --line:#dcdfe5; --fg:#16181d; --muted:#5d6572;
  --accent:#e55a00; --accent-ink:#ffffff; --accent-soft:rgba(229,90,0,.10);
  --good:#12805c; --good-soft:rgba(18,128,92,.11); --warn:#966300; --warn-soft:rgba(150,99,0,.12);
  --bad:#c92a2a; --bad-soft:rgba(201,42,42,.10); --info:#1d62c9; --info-soft:rgba(29,98,201,.10); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#f0f1f4; --line:#dcdfe5; --fg:#16181d; --muted:#5d6572;
  --accent:#e55a00; --accent-ink:#ffffff; --accent-soft:rgba(229,90,0,.10);
  --good:#12805c; --good-soft:rgba(18,128,92,.11); --warn:#966300; --warn-soft:rgba(150,99,0,.12);
  --bad:#c92a2a; --bad-soft:rgba(201,42,42,.10); --info:#1d62c9; --info-soft:rgba(29,98,201,.10); color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.brand small{font:500 11px var(--font);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:1px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good)}
.dot.pulse{animation:pulse .9s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.dot.pulse{animation:none}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.btn.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
select,input[type=text],input[type=email],input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;min-width:0}
.panes{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1150px){.panes.split{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0}
.pane-head{border-radius:13px 13px 0 0;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.pane-head .sp{flex:1}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:transparent;padding:11px 12px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;font-weight:600}
.body{padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font:600 15px var(--display);margin:0;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--surface2);min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:700 24px var(--display);letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:1px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.good .v{color:var(--good)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0;flex-wrap:wrap}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:160px}
.row .t{font-weight:600}
.row .m{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.cd{font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
.cd.ok{color:var(--good)} .cd.warn{color:var(--warn)} .cd.bad{color:var(--bad)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;display:flex;gap:2px}
.bar i{display:block;height:100%}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.segs i.p{background:var(--good)} .segs i.w{background:var(--accent)} .segs i.a{background:var(--warn)}
.scroll-x{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(214px,1fr);gap:10px;min-width:max-content}
.col{background:var(--surface2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;width:220px}
.col h3{margin:2px 4px;font:600 12px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.card .t{font-weight:600;font-size:13px}
.card .m{font-size:12px;color:var(--muted)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px 6px 0;font-weight:600}
.table td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:middle}
.num{font-variant-numeric:tabular-nums;text-align:right}
.note{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.approve{display:flex;flex-direction:column;gap:9px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:13px}
.approve.late{border-color:var(--bad);background:var(--bad-soft)}
.approve .btns{display:flex;gap:8px;flex-wrap:wrap}
.approve input{flex:1;min-width:160px}
.hello{font:700 22px var(--display);letter-spacing:-.02em;margin:0}
.big{font:700 34px var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.feed .row{font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:30;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.addform{display:flex;gap:8px;flex-wrap:wrap}
.addform input{flex:1;min-width:120px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select{width:100%}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.step .grow{flex:1;min-width:180px}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.tick.done{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
textarea{width:100%;min-height:150px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px ui-monospace,Menlo,Consolas,monospace}
.backup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mini{font-size:12px;color:var(--muted)}
.sugwrap{position:relative;flex:1;min-width:140px}
.sugwrap input{width:100%}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:25;max-height:270px;overflow:auto}
.sug button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:9px 12px;border-top:1px solid var(--line)}
.sug button:first-child{border-top:0}
.sug button:hover,.sug button:focus-visible{background:var(--surface2)}
</style>

<div class="wrap" id="loginWrap" style="max-width:380px;margin:60px auto">
  <div class="pane" style="padding:24px">
    <div class="brand" style="margin-bottom:18px"><div class="logo">S</div><div>Story Builder Console</div></div>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
      <div class="fld"><label for="loginEmail">Email</label><input id="loginEmail" type="email" required autocomplete="username"></div>
      <div class="fld"><label for="loginPass">Password</label><input id="loginPass" type="password" required autocomplete="current-password"></div>
      <div id="loginError" class="mini" style="color:var(--bad)"></div>
      <button type="submit" class="btn primary" id="loginBtn">Log in</button>
      <a href="#" id="forgotLink" class="mini" style="color:var(--accent);text-align:center">Forgot password?</a>
    </form>
  </div>
</div>

<div class="wrap" id="setPwWrap" style="max-width:380px;margin:60px auto;display:none">
  <div class="pane" style="padding:24px">
    <div class="brand" style="margin-bottom:18px"><div class="logo">S</div><div>Set your password</div></div>
    <form id="setPwForm" style="display:flex;flex-direction:column;gap:12px">
      <div class="fld"><label for="setPwNew">New password</label><input id="setPwNew" type="password" required autocomplete="new-password" minlength="8"></div>
      <div class="fld"><label for="setPwConfirm">Confirm password</label><input id="setPwConfirm" type="password" required autocomplete="new-password" minlength="8"></div>
      <div id="setPwError" class="mini" style="color:var(--bad)"></div>
      <button type="submit" class="btn primary">Set password &amp; continue</button>
    </form>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none">
  <header class="topbar">
    <div class="brand"><div class="logo">S</div><div>Story Builder Console<small>Live · connected to your database</small></div></div>
    <div class="tools">
      <span class="sync" id="sync"><span class="dot" id="dot"></span><span id="synctxt">Live</span></span>
      <button type="button" class="btn" data-a="backup" id="bk">Backup</button>
    </div>
  </header>
  <div id="backup"></div>
  <main class="panes" id="panes"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const SUPABASE_URL='https://dvazqcphiyeqetbhkozn.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2YXpxY3BoaXllcWV0Ymhrb3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3NzgyNDMsImV4cCI6MjExMTM1NDI0M30.uVz0238oD_qifK_qmRHge_No3bOcqMP8EJn9HPcHrLs';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const HR=36e5, DAY=24*HR, FREE_REVISIONS=2;
const STAGES=['idea','script_drafted','script_sent','script_approved','shot','editing','edit_sent','edit_approved','posted'];
const STAGE_LABEL={idea:'Idea',script_drafted:'Draft ready',script_sent:'Sent for approval',script_approved:'Approved to produce',shot:'Shot',editing:'Editing',edit_sent:'Edit sent',edit_approved:'Edit approved',posted:'Delivered'};
const CLIENT_STATUS={idea:'Idea stage',script_drafted:'Being written',script_sent:'Needs your approval',script_approved:'Approved, production planned',shot:'Shot, editing starts next',editing:'Being edited',edit_sent:'Edit ready, needs your approval',edit_approved:'Approved, scheduled',posted:'Delivered'};
const FLOW={idea:['script_drafted','Draft ready'],script_drafted:['script_sent','Send for approval'],script_sent:['script_approved','Record approval'],script_approved:['shot','Mark shot'],shot:['editing','Start editing'],editing:['edit_sent','Send edit for approval'],edit_sent:['edit_approved','Record approval'],edit_approved:['posted','Mark delivered']};
const RESP={idea:'planner',script_drafted:'planner',script_approved:'shooter',shot:'editor',editing:'editor'};
const RESP_JOB={planner:'Planner',shooter:'Videographer',editor:'Editor'};
const LEAD_STAGES=['To visit','Visited','Follow-up','Trial signed','Plan signed','Not interested'];
const SERVICES=['Video content','Website','Social media','Ads','Branding','Other'];
const PLANS=[['m1','Retainer: monthly',1],['m3','Retainer: quarterly',3],['m6','Retainer: half-yearly',6],['m12','Retainer: annual',12],['once','One-time project',0]];
const JOBS=['Planner','Videographer','Editor','Manager','Other'];
const ITEM_TYPES=['Reel','Post','Video','Web page','Other'];
const STATUSES=['Active','On hold','Completed'];
const TABS={
  admin:[['overview','Overview'],['clients','Clients'],['pipeline','Pipeline'],['board','Content board'],['approvals','Approvals'],['invoices','Invoices'],['team','Team']],
  manager:[['overview','Overview'],['clients','Clients'],['pipeline','Pipeline'],['board','Content board'],['approvals','Approvals'],['team','Team']],
  employee:[['myday','My day'],['board','Content board']],
  client:[['overview','Overview'],['approvals','Approvals'],['results','Results'],['plan','Plan and invoices']]
};

let state, panes, drafts={}, lastSync=Date.now(), armed=null, showBackup=false;
let authProfile=null; // {id,email,role,client_id}

const blank=()=>({clients:[],items:[],invoices:[],leads:[],people:[],activity:[]});
const now=()=>Date.now();
const $=s=>document.querySelector(s);
const uid=_=>crypto.randomUUID();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const dstr=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit'}):'-';
const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fromIso=s=>s?new Date(s+'T00:00:00').getTime():null;
const addMonths=(t,m)=>{const d=new Date(t);d.setMonth(d.getMonth()+m);return d.getTime()};
const client=id=>state.clients.find(c=>c.id===id);
const item=id=>state.items.find(r=>r.id===id);
const person=id=>state.people.find(p=>p.id===id);
const due=r=>r.sentAt+48*HR;
const active=()=>state.clients.filter(c=>c.status==='Active');
const planLabel=c=>{const t=(PLANS.find(p=>p[2]===c.months)||PLANS[4])[1].replace('Retainer: ','');return t.charAt(0).toUpperCase()+t.slice(1)};
const PER={1:'month',3:'quarter',6:'6 months',12:'year'};
const isRet=c=>c.months>0;
const cname=id=>{const c=client(id);return c?c.name:'(deleted client)'};
const contact=c=>c.contact||c.name;
const pending=()=>state.items.filter(r=>(r.stage==='script_sent'||r.stage==='edit_sent')&&client(r.c)).sort((a,b)=>due(a)-due(b));
const daysLeft=c=>c.end?Math.ceil((c.end-now())/DAY):null;
const itemsOf=cid=>state.items.filter(r=>r.c===cid);
const delivered=cid=>itemsOf(cid).filter(r=>r.stage==='posted').length;

function left(d){
  const ms=d-now(),a=Math.abs(ms),h=Math.floor(a/HR),m=Math.floor(a%HR/60000);
  return {txt:ms<0?'Overdue '+h+'h '+m+'m':h+'h '+m+'m left',cls:(ms<0||ms<6*HR)?'bad':ms<24*HR?'warn':'ok'};
}
const cd=d=>{const l=left(d);return '<span class="cd '+l.cls+'" data-due="'+d+'">'+l.txt+'</span>'};
function tone(s){
  if(s==='posted')return 'good';
  if(s==='script_sent'||s==='edit_sent')return 'warn';
  if(s==='script_approved'||s==='edit_approved')return 'info';
  if(s==='shot'||s==='editing')return 'accent';
  return '';
}
const stagePill=s=>'<span class="pill '+tone(s)+'">'+STAGE_LABEL[s]+'</span>';

/* ---------- DB <-> in-memory mappers ---------- */
function mapClientIn(row){return {id:row.id,name:row.name,contact:row.contact||'',phone:row.phone||'',email:row.email||'',service:row.service||'',months:row.months,
  start:row.start_date?fromIso(row.start_date):now(),end:row.end_date?fromIso(row.end_date):null,endCustom:!!row.end_custom,status:row.status,notes:row.notes||'',
  fee:Number(row.fee)||0,created:row.created_at?new Date(row.created_at).getTime():now()}}
function mapClientOut(c){return {id:c.id,name:c.name,contact:c.contact||null,phone:c.phone||null,email:c.email||null,service:c.service||null,months:c.months,
  start_date:iso(c.start),end_date:c.end?iso(c.end):null,end_custom:!!c.endCustom,status:c.status,notes:c.notes||null,fee:c.fee||0}}
function mapItemIn(row){return {id:row.id,c:row.client_id,title:row.title,type:row.type,stage:row.stage,rev:row.rev||0,sentAt:row.sent_at?new Date(row.sent_at).getTime():null,
  shoot:row.shoot_date?new Date(row.shoot_date).getTime():null,views:row.views||0,likes:row.likes||0,saves:row.saves||0,note:row.note||'',reminded:row.reminded||0,
  shifted:!!row.shifted,planner:row.planner_id,shooter:row.shooter_id,editor:row.editor_id}}

async function loadFromDb(){
  const [c,i,inv,l,p,a]=await Promise.all([
    sb.from('clients').select('*'),
    sb.from('content_items').select('*'),
    sb.from('invoices').select('*'),
    sb.from('leads').select('*'),
    sb.from('people').select('*'),
    sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(60),
  ]);
  state=blank();
  state.clients=(c.data||[]).map(mapClientIn);
  state.items=(i.data||[]).map(mapItemIn);
  state.invoices=(inv.data||[]).map(mapInvoiceIn);
  state.leads=(l.data||[]).map(mapLeadIn);
  state.people=(p.data||[]).map(mapPersonIn);
  state.activity=(a.data||[]).map(mapActivityIn);
}

async function inviteLogin({email,name,role,clientId}){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) throw new Error('Not logged in');
  const res=await fetch('/api/console-invite',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
    body:JSON.stringify({email,name,role,clientId})
  });
  const json=await res.json().catch(()=>({ok:false,error:'Unexpected server response'}));
  if(!json.ok) throw new Error(json.error||'Invite failed');
  return json;
}

let raf=0;
function mutate(fn,msg,sync){
  fn(); lastSync=Date.now();
  if(sync){ Promise.resolve().then(sync).catch(e=>toast('Sync problem: '+(e&&e.message?e.message:'could not save to the database'))); }

/* ---------- workflow ---------- */
function advance(id,who){
  const r=item(id),f=FLOW[r.stage]; if(!f)return;
  mutate(()=>{
    r.stage=f[0];
    if(f[0]==='script_sent'||f[0]==='edit_sent') r.sentAt=now();
    log(who,f[1]+': '+r.title,r.c,true);
  },f[1]+' done',()=>Promise.all([upsertItem(r),insertActivity(state.activity[0])]));
}
function clientApprove(id){
  const r=item(id),kind=r.stage==='script_sent'?'draft':'edit';
  mutate(()=>{r.stage=kind==='draft'?'script_approved':'edit_approved'; log({cl:r.c},'approved the '+kind+': '+r.title,r.c,true)},'Approved. The team sees it instantly.',()=>Promise.all([upsertItem(r),insertActivity(state.activity[0])]));
}
function clientChanges(id){
  const r=item(id),note=(drafts['n'+id]||'').trim();
  if(!note){toast('Add a short note so the team knows what to change');return}
  const kind=r.stage==='script_sent'?'draft':'edit';
  mutate(()=>{
    r.note=note; delete drafts['n'+id];
    if(kind==='draft') r.stage='script_drafted'; else {r.stage='editing'; r.rev+=1}
    log({cl:r.c},'requested changes on the '+kind+': '+r.title,r.c,true);
  },'Changes sent to the team',()=>Promise.all([upsertItem(r),insertActivity(state.activity[0])]));
}
function defaultAssignee(job){const p=state.people.find(p=>p.job===job);return p?p.id:null}
function newItem(cid,title,type,shoot){
  return {id:uid(),c:cid,title,type,stage:'idea',rev:0,sentAt:null,shoot:shoot||null,views:0,likes:0,saves:0,note:'',reminded:0,shifted:false,
    planner:defaultAssignee('Planner'),shooter:defaultAssignee('Videographer'),editor:defaultAssignee('Editor')};
}
function removeClient(id){
  state.items=state.items.filter(i=>i.c!==id);
  state.invoices=state.invoices.filter(i=>i.c!==id);
  state.activity=state.activity.filter(a=>a.c!==id);
  state.leads.forEach(l=>{if(l.clientId===id)l.clientId=null});
  state.clients=state.clients.filter(c=>c.id!==id);
}
function removePerson(id){
  state.items.forEach(r=>{['planner','shooter','editor'].forEach(k=>{if(r[k]===id)r[k]=null})});
  state.people=state.people.filter(p=>p.id!==id);
}
function clientDefaults(c,lead){
  const planKey=c?(isRet(c)?'m'+c.months:'once'):'m1';
  return {cf_name:c?c.name:(lead?lead.name:''),cf_contact:c?c.contact:'',cf_phone:c?c.phone:'',cf_email:c?c.email:'',cf_service:c?c.service:'Video content',
    cf_plan:planKey,cf_fee:c?String(c.fee||''):'',cf_start:iso(c?c.start:now()),cf_end:(c&&c.endCustom)?iso(c.end):'',cf_status:c?c.status:'Active',cf_notes:c?c.notes:(lead?'Area: '+lead.area:'')};
}
function saveClient(p){
  const d=drafts,name=(d.cf_name||'').trim();
  if(!name){toast('Enter the client name');return}
  const planKey=d.cf_plan||'m1',months=(PLANS.find(x=>x[0]===planKey)||PLANS[0])[2];
  const start=fromIso(d.cf_start)||now(),endIn=fromIso(d.cf_end);
  const fee=p.role==='admin'?Math.max(0,Number(d.cf_fee)||0):null;
  const isNew=p.form.id==='new';
  const inviteEmail=(d.cf_email||'').trim(),inviteName=(d.cf_contact||'').trim()||name;
  let c, linkedLead=null;
  mutate(()=>{
    if(isNew){c={id:uid(),fee:0,created:now()};state.clients.push(c)}else c=client(p.form.id);
    Object.assign(c,{name,contact:(d.cf_contact||'').trim(),phone:(d.cf_phone||'').trim(),email:(d.cf_email||'').trim(),service:d.cf_service,months,start,
      end:endIn||(months?addMonths(start,months):null),endCustom:!!endIn,status:d.cf_status,notes:(d.cf_notes||'').trim()});
    if(fee!==null)c.fee=fee;
    if(isNew&&p.form.lead){const l=state.leads.find(l=>l.id===p.form.lead);if(l){l.clientId=c.id;l.stage='Plan signed';linkedLead=l}}
    log('Team',(isNew?'added client ':'updated client ')+c.name,c.id,false);
    p.form=null;
  },isNew?'Client added':'Client updated everywhere',async()=>{
    const tasks=[upsertClient(c),insertActivity(state.activity[0])];
    if(linkedLead) tasks.push(upsertLead(linkedLead));
    await Promise.all(tasks);
    if(isNew&&inviteEmail){
      try{ await inviteLogin({email:inviteEmail,name:inviteName,role:'client',clientId:c.id}); toast('Login invite sent to '+inviteEmail) }
      catch(e){ toast('Client saved, but invite email failed: '+e.message) }
    }
  });
}

const A={
  tab:d=>{P(d.pane).tab=d.v;render()},
  adv:d=>advance(d.reel,d.who||'Team'),
  approve:d=>clientApprove(d.reel),

  remind:d=>{const r=item(d.reel),c=client(r.c);mutate(()=>{r.reminded++;log('Reminder','queued for '+contact(c)+' (WhatsApp, simulated): '+r.title,r.c,false)},'Reminder queued for '+contact(c),()=>Promise.all([upsertItem(r),insertActivity(state.activity[0])]))},
  shift:d=>{const r=item(d.reel),days=Math.max(1,Math.ceil((now()-due(r))/DAY));
    mutate(()=>{if(r.shoot)r.shoot+=days*DAY;r.shifted=true;log('Team','moved dates by '+days+' day(s) due to late approval: '+r.title,r.c,true)},'Dates moved by '+days+' day(s)',()=>Promise.all([upsertItem(r),insertActivity(state.activity[0])]))},
  paid:d=>{const i=state.invoices.find(i=>i.id===d.inv);mutate(()=>{i.paid=true;i.paidOn=now();log('Finance','recorded payment '+i.no+' ('+money(i.amount)+')',i.c,true)},'Payment recorded',()=>Promise.all([upsertInvoice(i),insertActivity(state.activity[0])]))},
  newinv:()=>{
    const cid=drafts.invClient||(active()[0]||{}).id;if(!cid){toast('Add a client first');return}

    },'Invoice created',()=>Promise.all([upsertInvoice(inv),insertActivity(state.activity[0])]));

  pick:d=>{
    hideSug();
    if(d.key==='leadName'){
      if(d.k==='client'){const c=client(d.id),m=(c.notes||'').match(/Area:\s*(.+)/);drafts.leadName=c.name;drafts.leadClient=c.id;if(m)drafts.leadArea=m[1];
        document.querySelectorAll('[data-draft=leadName]').forEach(i=>i.value=drafts.leadName);document.querySelectorAll('[data-draft=leadArea]').forEach(i=>i.value=drafts.leadArea||'');toast('Existing client selected. Add lead links it.')}

    }else if(d.key==='cf_name'){
      const p=P(d.pane);

      else{const l=state.leads.find(l=>l.id===d.id);drafts.cf_name=l.name;if(!drafts.cf_notes)drafts.cf_notes='Area: '+l.area;p.form={id:'new',lead:l.id};toast('Lead selected. It will be linked.')}
      render();
    }
  },
  addlead:()=>{
    const name=(drafts.leadName||'').trim();if(!name){toast('Enter the business name');return}
    const dup=state.leads.find(l=>l.name.toLowerCase()===name.toLowerCase());
    if(dup){toast('Already in your pipeline ('+dup.stage+')');return}
    let cid=drafts.leadClient&&client(drafts.leadClient)?drafts.leadClient:null;
    if(!cid){const c=state.clients.find(c=>c.name.toLowerCase()===name.toLowerCase());if(c)cid=c.id}
    let lead;
    mutate(()=>{lead={id:uid(),name,area:(drafts.leadArea||'').trim()||'-',stage:cid?'Plan signed':'To visit',clientId:cid};state.leads.unshift(lead);drafts.leadName='';drafts.leadArea='';drafts.leadClient='';log('Team','added lead '+name,cid,false)},cid?'Linked to existing client':'Lead added',()=>Promise.all([upsertLead(lead),insertActivity(state.activity[0])]));
  },
  convert:d=>{const p=P(d.pane),l=state.leads.find(l=>l.id===d.lead);Object.assign(drafts,clientDefaults(null,l));p.tab='clients';p.form={id:'new',lead:l.id};render()},
  cnew:d=>{const p=P(d.pane);Object.assign(drafts,clientDefaults(null,null));p.form={id:'new'};render()},
  cedit:d=>{const p=P(d.pane);Object.assign(drafts,clientDefaults(client(d.client),null));p.form={id:d.client};render()},
  cclose:d=>{P(d.pane).form=null;render()},
  csave:d=>saveClient(P(d.pane)),
  open:d=>{const p=P(d.pane);p.portal='client';p.client=d.client;p.tab='overview';render()},
  backToStaff:d=>{const p=P(d.pane);p.portal='staff';render()},

  additem:d=>{
    const cid=drafts.itClient||(active()[0]||{}).id,title=(drafts.itTitle||'').trim();
    if(!cid){toast('Add a client first');return}
    if(!title){toast('Enter a title');return}
    let r;
    mutate(()=>{r=newItem(cid,title,drafts.itType||'Reel',fromIso(drafts.itDate));state.items.push(r);drafts.itTitle='';log('Team','added '+(r.type||'item').toLowerCase()+': '+title,cid,true)},'Added to the content board',()=>Promise.all([upsertItem(r),insertActivity(state.activity[0])]));
  },
  add4:()=>{
    const cid=drafts.itClient||(active()[0]||{}).id;if(!cid){toast('Add a client first');return}
    const mon=new Date().toLocaleDateString('en-IN',{month:'short',year:'numeric'});
    let items;
    mutate(()=>{items=[];for(let i=1;i<=4;i++){const it=newItem(cid,'Reel '+i+' ('+mon+')','Reel',null);items.push(it);state.items.push(it)}log('Team','created the month: 4 reels',cid,true)},'4 reels created for '+cname(cid),()=>Promise.all(items.map(upsertItem).concat([insertActivity(state.activity[0])])));
  },
  addperson:()=>{
    const name=(drafts.pName||'').trim();if(!name){toast('Enter the name');return}
    const email=(drafts.pEmail||'').trim();
    let person_;
    mutate(()=>{person_={id:uid(),name,job:drafts.pJob||'Planner'};state.people.push(person_);drafts.pName='';drafts.pEmail='';log('Team','added team member '+name,null,false)},'Team member added',async()=>{
      await Promise.all([upsertPerson(person_),insertActivity(state.activity[0])]);
      if(email){
        try{ await inviteLogin({email,name,role:'manager'}); toast('Login invite sent to '+email) }
        catch(e){ toast('Team member saved, but invite email failed: '+e.message) }
      }
    });
  },
  del:d=>{
    const key=d.k+':'+d.id;
    if(armed!==key){armed=key;render();setTimeout(()=>{if(armed===key){armed=null;render()}},4000);return}
    armed=null;
    mutate(()=>{
      if(d.k==='client')removeClient(d.id);
      else if(d.k==='item')state.items=state.items.filter(i=>i.id!==d.id);
      else if(d.k==='lead')state.leads=state.leads.filter(l=>l.id!==d.id);
      else if(d.k==='person')removePerson(d.id);
      else if(d.k==='inv')state.invoices=state.invoices.filter(i=>i.id!==d.id);
    },'Deleted',()=>{
      if(d.k==='client')return deleteClient(d.id);
      if(d.k==='item')return deleteItem(d.id);
      if(d.k==='lead')return deleteLead(d.id);
      if(d.k==='person')return deletePerson(d.id);
      if(d.k==='inv')return deleteInvoice(d.id);
    });
  },
  backup:()=>{showBackup=!showBackup;renderBackup()},
  bkcopy:()=>{const t=$('#bkText');t.select();let ok=false;try{ok=navigator.clipboard&&navigator.clipboard.writeText(t.value)}catch(e){}if(ok&&ok.catch)ok.catch(()=>{});toast('Copied. Paste it somewhere safe.')}
};

function showSuggest(inp){
  const box=inp.parentNode.querySelector('.sug'),raw=inp.value.trim(),q=raw.toLowerCase(),key=inp.dataset.suggest;
  if(!q){box.hidden=true;return}
  const m=[];

  state.leads.forEach(l=>{if(!l.clientId&&l.name.toLowerCase().includes(q))m.push({k:'lead',id:l.id,name:l.name,sub:'Lead · '+l.stage})});
  box.innerHTML=(m.length?m.slice(0,6).map(x=>'<button type="button" data-a="pick" data-k="'+x.k+'" data-id="'+x.id+'" data-key="'+key+'" data-pane="'+(inp.dataset.pane||'')+'"><span><b>'+esc(x.name)+'</b> <span class="mini">'+esc(x.sub)+'</span></span><span class="pill '+(x.k==='client'?'good':'')+'">'+(x.k==='client'?'Existing client':'Lead')+'</span></button>').join(''):'')+
    '<div class="mini" style="padding:9px 12px;border-top:1px solid var(--line)">'+(m.length?'Or keep typing to add ':'No match. Add ')+'<b>'+esc(raw)+'</b> as new</div>';

function tasksFor(uid){

function cOverview(c){
  const rs=itemsOf(c.id),ap=cApprovals(c),d=daysLeft(c);
  return '<div><h1 class="hello">Hi '+esc(contact(c))+'</h1><div class="sub">'+esc(c.name)+' · '+esc(c.service)+' · '+planLabel(c)+'</div></div>'+
  '<div class="kpis">'+kpi('Status',esc(c.status),c.end?(isRet(c)?'plan ends ':'delivery ')+dstr(c.end):'')+
  (rs.length?kpi('Delivered',delivered(c.id)+'/'+rs.length,'content items','good')+kpi('Waiting for you',ap.length,ap.length?'please approve':'all caught up',ap.length?'warn':''):'')+
  (isRet(c)&&d!==null?kpi('Days left in plan',d,'renewal reminder at 14 days',d<=14?'warn':''):'')+'</div>'+
  (ap.length?ap.map(approveCard).join(''):'')+
  (rs.length?'<div class="panel"><div class="panel-h"><h2>Your content</h2></div><div class="list">'+rs.map(r=>'<div class="row"><div class="grow"><div class="t">'+esc(r.title)+'</div><div class="m">'+CLIENT_STATUS[r.stage]+(['script_approved','shot','editing'].includes(r.stage)&&r.shoot?' · '+dstr(r.shoot):'')+'</div></div>'+stagePill(r.stage)+'</div>').join('')+'</div></div>':'')+
  '<div class="panel"><div class="panel-h"><h2>Recent updates</h2></div>'+feed(state.activity.filter(a=>a.cv&&a.c===c.id),false)+'</div>';
}
function cApprovalsTab(c){const ap=cApprovals(c);return ap.length?ap.map(approveCard).join(''):'<div class="empty">Nothing needs your approval right now</div>'}
function cResults(c){
  const ps=itemsOf(c.id).filter(r=>r.stage==='posted'),v=ps.reduce((s,r)=>s+r.views,0),l=ps.reduce((s,r)=>s+r.likes,0),sv=ps.reduce((s,r)=>s+r.saves,0);
  return '<div class="kpis">'+kpi('Views',v.toLocaleString('en-IN'),ps.length+' delivered')+kpi('Likes',l.toLocaleString('en-IN'),'')+kpi('Saves',sv.toLocaleString('en-IN'),'')+'</div>'+
  (ps.length?'<div class="scroll-x"><table class="table"><thead><tr><th>Item</th><th class="num">Views</th><th class="num">Likes</th><th class="num">Saves</th></tr></thead><tbody>'+ps.map(r=>'<tr><td><b>'+esc(r.title)+'</b></td><td class="num">'+r.views.toLocaleString('en-IN')+'</td><td class="num">'+r.likes+'</td><td class="num">'+r.saves+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Results appear after the first item is delivered</div>')+
  '<div class="note">We share what happened, not promises. Results depend on your business, your offer and the platform.</div>';
}
function cPlan(c){
  const d=daysLeft(c),inv=state.invoices.filter(i=>i.c===c.id);
  return '<div class="kpis">'+kpi('Plan',planLabel(c),esc(c.service))+kpi(isRet(c)?'Plan ends':'Delivery',c.end?dstr(c.end):'-',d!==null?d+' days':'',d!==null&&d<=14?'warn':'')+'</div>'+
  '<div class="panel"><div class="panel-h"><h2>Invoices</h2></div>'+(inv.length?'<div class="list">'+inv.map(i=>{const od=!i.paid&&i.due<now();return '<div class="row"><div class="grow"><div class="t">'+i.no+'</div><div class="m">Due '+dstr(i.due)+'</div></div><b class="num">'+money(i.amount)+'</b><span class="pill '+(i.paid?'good':od?'bad':'warn')+'">'+(i.paid?'Paid':od?'Overdue':'Unpaid')+'</span></div>'}).join('')+'</div>':'<div class="empty">No invoices yet</div>')+'</div>';
}

/* ---------- shell ---------- */
function pane(p){
  const staff=p.portal==='staff',tabs=TABS[staff?p.role:'client'];
  const c=client(p.client);
  let badge=0;
  if(!staff&&c)badge=cApprovals(c).length; else if(staff&&p.role!=='employee')badge=pending().filter(r=>due(r)<now()).length;
  const previewing=!staff&&authProfile.role!=='client';
  const head='<div class="pane-head">'+
    (previewing?'<button type="button" class="btn sm" data-a="backToStaff" data-pane="'+p.id+'">&larr; Back to Story Builder</button>'
      :'<span class="pill">'+(staff?('Role: '+esc(authProfile.role==='admin'?'Admin':'Manager')):'Client portal')+'</span>')+
    '<span class="sp"></span><span class="mini">'+esc(authProfile.email)+'</span>'+
    '<button type="button" class="btn sm" data-a="logout">Log out</button></div>';
  const nav='<nav class="tabs" role="tablist">'+tabs.map(t=>'<button type="button" role="tab" data-a="tab" data-pane="'+p.id+'" data-v="'+t[0]+'" aria-selected="'+(p.tab===t[0])+'">'+t[1]+((t[0]==='approvals'&&badge)?'<span class="badge">'+badge+'</span>':'')+'</button>').join('')+'</nav>';
  let body='';
  if(staff){body=({overview:vOverview,clients:vClients,pipeline:vPipeline,board:vBoard,approvals:vApprovals,invoices:vInvoices,team:vTeam,myday:vMyDay}[p.tab]||vOverview)(p)}
  else if(!c){body='<div class="empty">No clients yet. Add one in the Story Builder view under Clients, then pick it here.</div>'}
  else{body=({overview:cOverview,approvals:cApprovalsTab,results:cResults,plan:cPlan}[p.tab]||cOverview)(c)}
  return '<section class="pane" aria-label="'+(staff?'Staff console':'Client portal')+'">'+head+nav+'<div class="body">'+body+'</div></section>';
}
function renderBackup(){
  const el=$('#backup');
  if(!showBackup){el.innerHTML='';$('#bk').textContent='Backup';return}
  $('#bk').textContent='Close backup';
  el.innerHTML='<div class="backup"><div><h2>Export your data</h2><div class="mini">Your data lives in the database now. This is a read-only copy for your own records.</div></div><textarea id="bkText" aria-label="Backup data" readonly>'+esc(JSON.stringify(state,null,1))+'</textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-a="bkcopy">Copy</button></div></div>';
}
function render(){
  panes.forEach(p=>{
    if(p.portal==='staff'&&!TABS[p.role].some(t=>t[0]===p.tab))p.tab=TABS[p.role][0][0];
    if(!client(p.client))p.client=state.clients.length?state.clients[0].id:null;
    if(p.filter!=='all'&&!client(p.filter))p.filter='all';
    if(!person(p.user))p.user=state.people.length?state.people[0].id:null;
    if(p.form&&p.form.id!=='new'&&!client(p.form.id))p.form=null;
  });
  const el=$('#panes');
  const y=window.scrollY,xs=[...el.querySelectorAll('.scroll-x')].map(s=>s.scrollLeft);
  el.className='panes';
  el.innerHTML=panes.map(pane).join('');
  [...el.querySelectorAll('.scroll-x')].forEach((s,i)=>{if(xs[i])s.scrollLeft=xs[i]});
  window.scrollTo(0,y);
  if(showBackup&&document.activeElement&&document.activeElement.id!=='bkText')renderBackup();
}
function tick(){
  document.querySelectorAll('[data-due]').forEach(e=>{const l=left(+e.dataset.due);e.textContent=l.txt;e.className='cd '+l.cls});
  const s=Math.floor((Date.now()-lastSync)/1000);const se=$('#synctxt');if(se)se.textContent=s<5?'Live · saved just now':'Live · saved '+(s<60?s+'s':Math.floor(s/60)+'m')+' ago';
}

/* ---------- auth / bootstrap ---------- */
function showSetPasswordScreen(){
  $('#loginWrap').style.display='none';
  $('#appWrap').style.display='none';
  $('#setPwWrap').style.display='';
}
document.getElementById('forgotLink').addEventListener('click',async e=>{
  e.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  if(!email){toast('Enter your email above first');return}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/db'});
  if(error){toast(error.message);return}
  toast('Check your email for a reset link.');
});
document.getElementById('setPwForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=document.getElementById('setPwNew').value,pw2=document.getElementById('setPwConfirm').value;
  const err=document.getElementById('setPwError');
  err.textContent='';
  if(pw.length<8){err.textContent='Password must be at least 8 characters.';return}
  if(pw!==pw2){err.textContent='Passwords do not match.';return}
  const {error}=await sb.auth.updateUser({password:pw});
  if(error){err.textContent=error.message;return}
  history.replaceState(null,'',location.pathname);
  $('#setPwWrap').style.display='none';
  await boot();
});
sb.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY') showSetPasswordScreen();
});
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#loginWrap').style.display='';$('#appWrap').style.display='none';return}
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!prof){
    $('#loginError').textContent='No access configured for this account yet.';
    await sb.auth.signOut();
    return;
  }
  authProfile={id:prof.id,email:prof.email,role:prof.role,client_id:prof.client_id};
  $('#loginWrap').style.display='none';
  $('#appWrap').style.display='';
  await loadFromDb();
  panes=[{id:1,
    portal:authProfile.role==='client'?'client':'staff',
    role:authProfile.role==='client'?'admin':authProfile.role,
    client:authProfile.role==='client'?authProfile.client_id:null,
    tab:(authProfile.role==='client'?TABS.client:TABS[authProfile.role])[0][0],
    filter:'all',form:null,user:null}];
  render();
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginError');
  const btn=document.getElementById('loginBtn');
  errEl.textContent='';btn.disabled=true;btn.textContent='Logging in…';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;btn.textContent='Log in';
  if(error){errEl.textContent=error.message;return}
  await boot();
});
(async function start(){
  const hash=window.location.hash||'';
  if(hash.indexOf('type=invite')>-1||hash.indexOf('type=recovery')>-1){
    await new Promise(r=>setTimeout(r,300)); // let supabase-js finish parsing the URL into a session
    showSetPasswordScreen();
  } else {
    await boot();
  }
})();
setInterval(tick,5000);
})();
</script>
